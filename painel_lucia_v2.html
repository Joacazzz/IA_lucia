<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Lucía — Painel Administrativo v2</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:   #0c0e14; --bg2: #12151e; --bg3: #191d28; --bg4: #212636;
  --b:    rgba(255,255,255,0.07); --b2: rgba(255,255,255,0.12);
  --t:    #e8eaf0; --t2: #8b909e; --t3: #555a6a;
  --acc:  #5b8ef0; --acc2: #3d6fd4; --acc-g: rgba(91,142,240,0.13);
  --grn:  #3ecf8e; --grn-g: rgba(62,207,142,0.1);
  --amb:  #f5a623; --amb-g: rgba(245,166,35,0.1);
  --red:  #f06060; --red-g: rgba(240,96,96,0.1);
  --pur:  #a78bfa; --pur-g: rgba(167,139,250,0.1);
  --r: 10px; --rl: 14px;
}
body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--t); min-height:100vh; font-size:14px; line-height:1.6; }
::-webkit-scrollbar { width:3px; } ::-webkit-scrollbar-thumb { background:var(--bg4); border-radius:4px; }

/* ── LOGIN ──────────────────────────────────────────────── */
.login-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; background:radial-gradient(ellipse at 30% 40%, rgba(91,142,240,0.07) 0%, transparent 60%), var(--bg); }
.login-card { width:380px; background:var(--bg2); border:1px solid var(--b2); border-radius:var(--rl); padding:40px; }
.login-logo { font-size:24px; font-weight:600; letter-spacing:-0.5px; margin-bottom:4px; }
.login-sub  { font-size:12px; color:var(--t3); margin-bottom:32px; text-transform:uppercase; letter-spacing:1px; }
.login-err  { background:var(--red-g); border:1px solid rgba(240,96,96,0.25); border-radius:var(--r); padding:10px 14px; font-size:13px; color:var(--red); margin-bottom:16px; }
.login-hint { margin-top:20px; padding:12px; background:var(--bg3); border-radius:var(--r); font-size:12px; color:var(--t3); text-align:center; }
.login-hint code { color:var(--acc); font-family:'DM Mono',monospace; }

/* ── LAYOUT ─────────────────────────────────────────────── */
.layout  { display:flex; min-height:100vh; }
.sidebar { width:220px; min-width:220px; background:var(--bg2); border-right:1px solid var(--b); display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto; }
.logo    { padding:22px 18px 18px; border-bottom:1px solid var(--b); }
.logo-title { font-size:18px; font-weight:600; letter-spacing:-0.3px; display:flex; align-items:center; gap:8px; }
.logo-sub   { font-size:10px; color:var(--t3); margin-top:3px; text-transform:uppercase; letter-spacing:1px; }
.dot  { width:7px; height:7px; background:var(--grn); border-radius:50%; box-shadow:0 0 6px var(--grn); animation:pulse 2s infinite; flex-shrink:0; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
.nav { padding:10px 8px; flex:1; }
.nav-lbl  { font-size:10px; text-transform:uppercase; letter-spacing:1px; color:var(--t3); padding:8px 10px 4px; }
.nav-item { display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:var(--r); cursor:pointer; color:var(--t2); font-size:13.5px; transition:all .15s; margin-bottom:2px; border:1px solid transparent; }
.nav-item:hover { background:var(--bg3); color:var(--t); }
.nav-item.active { background:var(--acc-g); color:var(--acc); border-color:rgba(91,142,240,0.2); font-weight:500; }
.nav-icon  { width:18px; text-align:center; font-size:14px; }
.nav-badge { margin-left:auto; background:var(--amb); color:#000; font-size:10px; font-weight:600; padding:1px 6px; border-radius:20px; font-family:'DM Mono',monospace; }
.notif-badge { margin-left:auto; background:var(--red); color:#fff; font-size:10px; font-weight:600; padding:1px 6px; border-radius:20px; font-family:'DM Mono',monospace; }
.sidebar-foot { padding:14px 18px; border-top:1px solid var(--b); font-size:11px; color:var(--t3); }
.user-row { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.avatar { width:28px; height:28px; border-radius:50%; background:var(--acc-g); border:1px solid rgba(91,142,240,0.3); display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--acc); font-weight:600; flex-shrink:0; }
.user-name { font-size:12px; color:var(--t2); font-weight:500; }
.user-role { font-size:10px; color:var(--t3); }
.logout-btn { width:100%; background:transparent; border:1px solid var(--b2); border-radius:var(--r); padding:6px; color:var(--t3); font-size:11.5px; cursor:pointer; transition:all .15s; font-family:'DM Sans',sans-serif; }
.logout-btn:hover { border-color:var(--red); color:var(--red); }

/* ── MAIN ───────────────────────────────────────────────── */
.main    { flex:1; display:flex; flex-direction:column; overflow:hidden; min-width:0; }
.topbar  { background:var(--bg2); border-bottom:1px solid var(--b); padding:13px 26px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
.topbar-title { font-size:15px; font-weight:500; }
.topbar-sub   { font-size:12px; color:var(--t3); margin-top:1px; }
.content { flex:1; overflow-y:auto; padding:22px 26px; }

/* ── BUTTONS ────────────────────────────────────────────── */
.btn { display:inline-flex; align-items:center; gap:6px; padding:7px 14px; border-radius:var(--r); font-size:13px; font-weight:500; cursor:pointer; border:none; transition:all .15s; font-family:'DM Sans',sans-serif; }
.btn-primary { background:var(--acc); color:#fff; }
.btn-primary:hover { background:var(--acc2); }
.btn-ghost   { background:transparent; color:var(--t2); border:1px solid var(--b2); }
.btn-ghost:hover { background:var(--bg3); color:var(--t); }
.btn-danger  { background:var(--red-g); color:var(--red); border:1px solid rgba(240,96,96,0.2); }
.btn-danger:hover { background:rgba(240,96,96,0.22); }
.btn-sm { padding:4px 10px; font-size:12px; }
.btn:disabled { opacity:.5; cursor:not-allowed; }

/* ── FORMS ──────────────────────────────────────────────── */
.fg { margin-bottom:14px; }
.fl { font-size:12px; color:var(--t2); margin-bottom:5px; display:block; font-weight:500; }
.fi, .fs, .ft {
  width:100%; background:var(--bg3); border:1px solid var(--b2); border-radius:var(--r);
  padding:8px 12px; color:var(--t); font-size:13.5px; font-family:'DM Sans',sans-serif;
  outline:none; transition:border-color .15s;
}
.fi:focus,.fs:focus,.ft:focus { border-color:var(--acc); }
.fi::placeholder,.ft::placeholder { color:var(--t3); }
.ft { resize:vertical; min-height:80px; line-height:1.5; }
.g2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.select, .input {
  background:var(--bg3); border:1px solid var(--b2); border-radius:var(--r);
  padding:6px 10px; color:var(--t); font-size:12.5px; font-family:'DM Sans',sans-serif;
  outline:none; transition:border-color .15s;
}
.select:focus,.input:focus { border-color:var(--acc); }
.input { width:190px; }
.input::placeholder { color:var(--t3); }

/* ── CARDS ──────────────────────────────────────────────── */
.stats-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:20px; }
.stat-card { background:var(--bg2); border:1px solid var(--b); border-radius:var(--rl); padding:18px 20px; position:relative; overflow:hidden; transition:border-color .2s; }
.stat-card:hover { border-color:var(--b2); }
.stat-acc   { position:absolute; top:0; right:0; width:3px; height:100%; }
.stat-lbl   { font-size:11px; text-transform:uppercase; letter-spacing:.8px; color:var(--t3); margin-bottom:8px; }
.stat-val   { font-size:28px; font-weight:600; line-height:1; letter-spacing:-1px; font-family:'DM Mono',monospace; }
.stat-sub   { font-size:11px; color:var(--t3); margin-top:5px; }
.card       { background:var(--bg2); border:1px solid var(--b); border-radius:var(--rl); overflow:hidden; }
.card-hd    { padding:14px 18px; border-bottom:1px solid var(--b); display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
.card-title { font-size:14px; font-weight:500; }
.card-sub   { font-size:11px; color:var(--t3); }
.chart-wrap { padding:16px 18px; }

/* ── CHARTS GRID ────────────────────────────────────────── */
.charts-grid { display:grid; grid-template-columns:1fr 1.6fr; gap:14px; margin-bottom:20px; }
.dash-grid   { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.chart-label { font-size:12px; color:var(--t3); margin-bottom:10px; }

/* ── TABLE ──────────────────────────────────────────────── */
table { width:100%; border-collapse:collapse; }
th { text-align:left; padding:10px 14px; font-size:11px; text-transform:uppercase; letter-spacing:.7px; color:var(--t3); border-bottom:1px solid var(--b); font-weight:500; }
td { padding:11px 14px; border-bottom:1px solid var(--b); font-size:13px; color:var(--t2); vertical-align:middle; }
tr:last-child td { border-bottom:none; }
tr:hover td { background:rgba(255,255,255,.015); }
.mono { font-family:'DM Mono',monospace; font-size:12px; color:var(--acc); }

/* ── BADGES ─────────────────────────────────────────────── */
.badge { display:inline-flex; align-items:center; gap:4px; padding:3px 8px; border-radius:20px; font-size:11px; font-weight:500; white-space:nowrap; }
.bd    { width:5px; height:5px; border-radius:50%; }
.b-grn  { background:var(--grn-g); color:var(--grn); } .b-grn  .bd { background:var(--grn); }
.b-amb  { background:var(--amb-g); color:var(--amb); } .b-amb  .bd { background:var(--amb); }
.b-red  { background:var(--red-g); color:var(--red); } .b-red  .bd { background:var(--red); }
.b-pur  { background:var(--pur-g); color:var(--pur); } .b-pur  .bd { background:var(--pur); }
.b-gray { background:var(--bg4);   color:var(--t2);  } .b-gray .bd { background:var(--t3); }
.depto-tag { display:inline-block; padding:2px 8px; border-radius:6px; font-size:11px; background:var(--bg4); color:var(--t2); border:1px solid var(--b); }
.role-tag  { display:inline-block; padding:2px 8px; border-radius:6px; font-size:11px; }
.role-admin  { background:rgba(91,142,240,.12); color:var(--acc); border:1px solid rgba(91,142,240,.2); }
.role-atend  { background:var(--bg4); color:var(--t2); border:1px solid var(--b); }

/* ── MODAL ──────────────────────────────────────────────── */
.overlay { position:fixed; inset:0; background:rgba(0,0,0,.72); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; z-index:100; animation:fi .15s ease; }
@keyframes fi  { from{opacity:0} to{opacity:1} }
@keyframes su  { from{transform:translateY(14px);opacity:0} to{transform:translateY(0);opacity:1} }
.modal { background:var(--bg2); border:1px solid var(--b2); border-radius:var(--rl); width:500px; max-width:95vw; max-height:88vh; overflow-y:auto; animation:su .2s ease; }
.modal-hd { padding:18px 22px 14px; border-bottom:1px solid var(--b); display:flex; align-items:center; justify-content:space-between; }
.modal-title { font-size:15px; font-weight:500; }
.modal-bd { padding:18px 22px; }
.modal-ft { padding:14px 22px; border-top:1px solid var(--b); display:flex; gap:8px; justify-content:flex-end; }
.close-btn { background:none; border:none; color:var(--t3); cursor:pointer; font-size:20px; padding:1px 6px; border-radius:6px; transition:all .15s; line-height:1; }
.close-btn:hover { background:var(--bg4); color:var(--t); }
.detail-row { display:flex; gap:8px; padding:9px 0; border-bottom:1px solid var(--b); align-items:flex-start; }
.detail-row:last-child { border-bottom:none; }
.dk { font-size:11px; color:var(--t3); text-transform:uppercase; letter-spacing:.5px; min-width:105px; padding-top:2px; }
.dv { font-size:13px; color:var(--t); flex:1; }

/* ── NOTIF ──────────────────────────────────────────────── */
.notif-item { display:flex; gap:12px; padding:14px 16px; border-bottom:1px solid var(--b); align-items:flex-start; transition:background .15s; }
.notif-item:hover { background:var(--bg3); }
.notif-item:last-child { border-bottom:none; }
.notif-icon { width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:13px; flex-shrink:0; margin-top:2px; }
.ni-new    { background:var(--acc-g); }
.ni-update { background:var(--pur-g); }
.notif-msg  { font-size:13px; color:var(--t); margin-bottom:3px; }
.notif-time { font-size:11px; color:var(--t3); }

/* ── TOAST ──────────────────────────────────────────────── */
.toast-wrap { position:fixed; bottom:22px; right:22px; display:flex; flex-direction:column; gap:8px; z-index:200; }
.toast { background:var(--bg3); border:1px solid var(--b2); border-radius:var(--r); padding:11px 14px; font-size:13px; color:var(--t); animation:su .2s ease; display:flex; align-items:center; gap:8px; max-width:300px; box-shadow:0 8px 24px rgba(0,0,0,.45); }
.toast-success { border-left:3px solid var(--grn); }
.toast-error   { border-left:3px solid var(--red); }
.toast-info    { border-left:3px solid var(--acc); }

/* ── MISC ───────────────────────────────────────────────── */
.empty { text-align:center; padding:44px 22px; color:var(--t3); }
.empty-icon { font-size:28px; margin-bottom:10px; }
.empty-text { font-size:13px; }
.api-banner { background:var(--amb-g); border:1px solid rgba(245,166,35,.2); border-radius:var(--r); padding:9px 14px; font-size:12.5px; color:var(--amb); margin-bottom:18px; display:flex; align-items:center; gap:8px; }
.banner-code { font-family:'DM Mono',monospace; background:rgba(0,0,0,.25); padding:1px 6px; border-radius:4px; font-size:11px; }
.deptos-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:13px; }
.depto-card { background:var(--bg2); border:1px solid var(--b); border-radius:var(--rl); padding:18px; transition:border-color .2s,transform .15s; }
.depto-card:hover { border-color:var(--b2); transform:translateY(-1px); }
.depto-ic   { font-size:22px; margin-bottom:8px; }
.depto-nm   { font-size:14px; font-weight:500; margin-bottom:3px; }
.depto-ds   { font-size:12px; color:var(--t3); margin-bottom:10px; line-height:1.4; }
.depto-row  { display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--t2); margin-bottom:3px; }
.filters    { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
</style>
</head>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const API    = "https://ialucia-production.up.railway.app";

// ── Mock data ────────────────────────────────────────────────

// ── Helpers ──────────────────────────────────────────────────
function fmtDate(d) {
  if (!d) return "—";
  return new Date(d).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
}

function statusBadge(s) {
  const map = {
    "Aberto":       <span className="badge b-amb"><span className="bd"/>{s}</span>,
    "Em andamento": <span className="badge b-pur"><span className="bd"/>{s}</span>,
    "Resolvido":    <span className="badge b-grn"><span className="bd"/>{s}</span>,
    "Cancelado":    <span className="badge b-red"><span className="bd"/>{s}</span>,
  };
  return map[s] || <span className="badge b-gray">{s}</span>;
}

// ── Chart Component ──────────────────────────────────────────
function ChartWidget({ type, data, options, height = 220 }) {
  const ref  = useRef(null);
  const inst = useRef(null);
  const key  = JSON.stringify(data?.datasets?.map(d => d.data));

  useEffect(() => {
    if (!ref.current || typeof Chart === "undefined") return;
    if (inst.current) { inst.current.destroy(); inst.current = null; }
    Chart.defaults.color = "#8b909e";
    Chart.defaults.font.family = "'DM Sans', sans-serif";
    inst.current = new Chart(ref.current, { type, data, options });
    return () => { if (inst.current) { inst.current.destroy(); inst.current = null; } };
  }, [key]);

  return <canvas ref={ref} style={{ maxHeight: height + "px" }}/>;
}

function ToastList({ toasts, remove }) {
  return (
    <div className="toast-wrap">
      {toasts.map(t => (
        <div key={t.id} className={`toast toast-${t.type}`} onClick={() => remove(t.id)}>

// ── Modal Detalhe Protocolo ──────────────────────────────────
function ModalDetalhe({ proto, deptos, onClose, onUpdate, api }) {
  const [status, setStatus] = useState(proto.status);
  const [saving, setSaving] = useState(false);
  const depto = deptos.find(d => d.chave === proto.departamento_chave);

  async function salvar() {
    setSaving(true);
    try {
      const r = await api(`/protocolos/${proto.numero}`, "PATCH", { status });
      onUpdate(r);
    } catch { onUpdate({ ...proto, status }); }
    setSaving(false);
    onClose();
  }

  return (
    <div className="overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal">
        <div className="modal-hd">
          <div className="modal-title">Protocolo <span className="mono">{proto.numero}</span></div>
          <button className="close-btn" onClick={onClose}>×</button>
        </div>
        <div className="modal-bd">
          <div className="detail-row"><span className="dk">Solicitante</span><span className="dv">{proto.nome_solicitante}</span></div>
          <div className="detail-row"><span className="dk">Contato</span><span className="dv">{proto.contato}</span></div>
          <div className="detail-row"><span className="dk">Departamento</span><span className="dv">{depto ? `${depto.icone} ${depto.nome}` : proto.departamento_chave}</span></div>

          <div className="detail-row"><span className="dk">Descrição</span><span className="dv" style={{whiteSpace:"pre-wrap"}}>{proto.descricao}</span></div>
          <div className="detail-row">
            <span className="dk">Status</span>
            <span className="dv">
              <select className="fs" value={status} onChange={e => setStatus(e.target.value)} style={{width:"auto"}}>

function LoginPage({ onLogin }) {
  const [email, setEmail]     = useState("admin@lucia.com");
  const [senha, setSenha]     = useState("admin123");
  const [loading, setLoading] = useState(false);
  const [erro, setErro]       = useState("");

  async function handleLogin() {
    setLoading(true); setErro("");
    try {
      const r = await fetch(`${API}/auth/login`, {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ email, password: senha })
      });
      if (!r.ok) { const d = await r.json(); throw new Error(d.detail || "Erro"); }
      const data = await r.json();
      onLogin(data.access_token, data.user);
    } catch (e) {
      if (e.message.includes("Failed to fetch")) {
        // Modo demo offline
        onLogin("demo-token", { id:1, nome:"Administrador (Demo)", email, papel:"admin" });
      } else {
        setErro(e.message);
      }
    }
    setLoading(false);
  }

  function handleKey(e) { if (e.key === "Enter") handleLogin(); }

  return (
    <div className="login-wrap">
      <div className="login-card">
        <div className="login-logo">🔷 Lucía</div>
        <div className="login-sub">Central de Atendimento · Painel Admin</div>
        {erro && <div className="login-err">{erro}</div>}
        <div className="fg"><label className="fl">E-mail</label>
          <input className="fi" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={handleKey}/></div>
        <div className="fg"><label className="fl">Senha</label>
          <input className="fi" type="password" value={senha} onChange={e=>setSenha(e.target.value)} onKeyDown={handleKey}/></div>
        <button className="btn btn-primary" style={{width:"100%",justifyContent:"center",marginTop:4}} onClick={handleLogin} disabled={loading}>
          {loading ? "Entrando…" : "Entrar"}
        </button>
        <div className="login-hint">
          Login padrão: <code>admin@lucia.com</code> / <code>admin123</code><br/>
          (Se a API estiver offline, o painel abre em modo demonstração)
        </div>
      </div>
    </div>
  );
}

function App() {
  const [token,       setToken]       = useState(localStorage.getItem("lucia_token"));
  const [user,        setUser]        = useState(JSON.parse(localStorage.getItem("lucia_user") || "null"));
  const [page,        setPage]        = useState("dashboard");
  const [notifs,      setNotifs]      = useState([]);
  const [unread,      setUnread]      = useState(0);
  const [deptos,      setDeptos]      = useState(MOCK_DEPTOS);
  const [protos,      setProtos]      = useState(MOCK_PROTOS);
  const [atendentes,  setAtendentes]  = useState(MOCK_ATEND);
  const [apiOk,       setApiOk]       = useState(false);
  const [toasts,      setToasts]      = useState([]);
  const wsRef = useRef(null);

  function showToast(msg, type="success") {
    const id = Date.now();
    setToasts(t => [...t, {id, msg, type}]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3500);
  }

  function removeToast(id) { setToasts(t => t.filter(x => x.id !== id)); }

  // API helper
  const api = useCallback(async (path, method="GET", body=null) => {
    const opts = {
      method,
      headers: { "Content-Type":"application/json", ...(token && token !== "demo-token" ? {"Authorization":`Bearer ${token}`} : {}) }
    };
    if (body) opts.body = JSON.stringify(body);
    const r = await fetch(`${API}${path}`, opts);
    if (!r.ok) { const d = await r.json(); throw new Error(d.detail || "Erro"); }
    return method === "DELETE" ? null : r.json();
  }, [token]);

  // Load data from API
  useEffect(() => {
    if (!token || token === "demo-token") return;
    api("/departamentos").then(d => { if (d?.length) setDeptos(d); setApiOk(true); }).catch(()=>{});
    api("/protocolos?limit=200").then(d => { if (d) { setProtos(d); setApiOk(true); } }).catch(()=>{});
    api("/atendentes").then(d => { if (d) setAtendentes(d); }).catch(()=>{});
  }, [token]);

  // WebSocket
  useEffect(() => {
    if (!token || token === "demo-token") return;
    const ws = new WebSocket(WS_URL);
    ws.onmessage = e => {
      const data = JSON.parse(e.data);
      setNotifs(n => [{ ...data, id: Date.now() }, ...n].slice(0,100));
      setUnread(u => u+1);
      showToast(data.mensagem, "info");
      // Update protocols list on new or updated
      if (data.tipo === "status_atualizado") {
        setProtos(ps => ps.map(p => p.numero === data.protocolo ? {...p, status:data.status} : p));
      }
    };
    ws.onerror = ()=>{};
    wsRef.current = ws;
    return () => ws.close();
  }, [token]);

  function handleLogin(tok, usr) {
    localStorage.setItem("lucia_token", tok);
    localStorage.setItem("lucia_user", JSON.stringify(usr));
    setToken(tok); setUser(usr);
  }

  function handleLogout() {
    localStorage.removeItem("lucia_token");
    localStorage.removeItem("lucia_user");
    setToken(null); setUser(null);
    if (wsRef.current) wsRef.current.close();
  }

  function goPage(p) {
    setPage(p);
    if (p === "notificacoes") setUnread(0);
  }

  if (!token) return <LoginPage onLogin={handleLogin}/>;

  const pages = [
    { id:"dashboard",      icon:"◈",   label:"Dashboard" },
    { id:"protocolos",     icon:"📋",  label:"Protocolos", badge: protos.filter(p=>p.status==="Aberto").length || null },
    { id:"atendentes",     icon:"👤",  label:"Atendentes" },
    { id:"departamentos",  icon:"🏢",  label:"Departamentos" },
    { id:"notificacoes",   icon:"🔔",  label:"Notificações", notif: unread || null },
  ];

  const titles = { dashboard:"Dashboard", protocolos:"Protocolos", atendentes:"Atendentes", departamentos:"Departamentos", notificacoes:"Notificações" };

  return (
    <div className="layout">
      <aside className="sidebar">
        <div className="logo">
          <div className="logo-title"><span className="dot"/>Lucía</div>
          <div className="logo-sub">Painel Administrativo</div>
        </div>
        <nav className="nav">
          <div className="nav-lbl">Menu</div>
          {pages.map(p => (
            <div key={p.id} className={`nav-item ${page===p.id?"active":""}`} onClick={()=>goPage(p.id)}>
              <span className="nav-icon">{p.icon}</span>
              {p.label}
              {p.badge  ? <span className="nav-badge">{p.badge}</span>  : null}
              {p.notif  ? <span className="notif-badge">{p.notif}</span> : null}
            </div>
          ))}
        </nav>
        <div className="sidebar-foot">
          {user && (
            <div className="user-row">
              <div className="avatar">{user.nome.charAt(0).toUpperCase()}</div>
              <div><div className="user-name">{user.nome.split(" ")[0]}</div>
                <div className="user-role">{user.papel === "admin" ? "Administrador" : "Atendente"}</div></div>
            </div>
          )}
          <button className="logout-btn" onClick={handleLogout}>Sair da conta</button>
          <div style={{marginTop:8}}>{apiOk ? "🟢 API conectada" : "🟡 Modo demo"}</div>
        </div>
      </aside>

      <div className="main">
        <div className="topbar">
          <div>
            <div className="topbar-title">{titles[page]}</div>
            <div className="topbar-sub">Central de Atendimento ao Cidadão</div>
          </div>
          <div style={{fontSize:12,color:"var(--t3)",fontFamily:"DM Mono,monospace"}}>
            {new Date().toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit",month:"short",year:"numeric"})}
          </div>
        </div>

        <div className="content">
          {!apiOk && (
            <div className="api-banner">
              ⚠️ API offline — dados de demonstração. Para conectar: <span className="banner-code">python -m uvicorn main:app --reload</span>
            </div>
          )}
          {page === "dashboard"     && <PageDashboard protos={protos} deptos={deptos}/>}
          {page === "protocolos"    && <PageProtocolos deptos={deptos} protos={protos} setProtos={setProtos} api={api}/>}
          {page === "atendentes"    && <PageAtendentes deptos={deptos} atendentes={atendentes} setAtendentes={setAtendentes} api={api}/>}
          {page === "departamentos" && <PageDepartamentos deptos={deptos}/>}
          {page === "notificacoes"  && <PageNotificacoes notifs={notifs} clear={()=>setNotifs([])}/>}
        </div>
      </div>

      <ToastList toasts={toasts} remove={removeToast}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
